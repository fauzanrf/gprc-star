events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Docker internal DNS resolver (dinamis re-resolve IP container setiap 5 detik)
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;
        server_name _;

        set $backend_svc  http://backend:8000;
        set $frontend_svc http://frontend:80;
        set $wa_svc       http://wa-gateway:3001;
        set $pma_svc      http://phpmyadmin:80;

        # phpMyAdmin Database Manager
        location /phpmyadmin/ {
            rewrite ^/phpmyadmin/(.*) /$1 break;
            proxy_pass $pma_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # REST API & WebSocket endpoints
        location /api/ {
            proxy_pass $backend_svc;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # WebSocket direct prefix (fallback)
        location /ws/ {
            proxy_pass $backend_svc;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Swagger Docs
        location /docs {
            proxy_pass $backend_svc;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass $backend_svc;
            proxy_set_header Host $host;
        }

        # WhatsApp Gateway QR & Status
        location /wa/ {
            rewrite ^/wa/(.*) /$1 break;
            proxy_pass $wa_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Frontend SPA
        location / {
            proxy_pass $frontend_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
